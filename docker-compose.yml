version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ryflow-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-setup:
    image: ollama/ollama:latest
    container_name: ryflow-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo 'Pulling phi3:mini...';
        ollama pull phi3:mini --insecure || true;
        echo 'Pulling nomic-embed-text...';
        ollama pull nomic-embed-text --insecure || true;
        echo 'Model setup complete.';
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ryflow-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ryflow_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - OLLAMA_HOST=http://ollama:11434
      - RYFLOW_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: ryflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  ollama_data:
    driver: local
  ryflow_data:
    driver: local
